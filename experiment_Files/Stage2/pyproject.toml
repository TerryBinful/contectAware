[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-stability"
version = "2.0.0"
description = "Stage 2: decision-layer stabilisation mechanisms for continuous authentication (ExtraSensory)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8", "pyyaml>=6.0", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ca-stability = "ca_stability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
