# Experiment manifest — Stage 2 (machine-readable index of this experiment)
experiment:
  name: stage2_mechanism_comparison
  branch: experiment/stage2-mechanism-comparison
  preregistration: docs/Stage2/PREREGISTRATION_FROZEN.md
  status_record: docs/Stage2/EXPERIMENT_STATUS.md
research_question: >
  At a matched genuine false-lock rate, how do decision-layer stabilisation mechanisms differ in
  security, stability and responsiveness when they consume the same fixed score stream?
working_hypothesis: mechanisms exhibit different trade-offs at comparable operating points (no winner assumed)
dataset:
  name: ExtraSensory per-uuid features and labels
  url: http://extrasensory.ucsd.edu/data/primary_data_files/ExtraSensory.per_uuid_features_labels.zip
  md5: 9e44b3484b74cd8a370ff22894e0899b
  committed: false
entry_points:
  run: python scripts/run_experiment.py --config configs/main.yaml
  tests: python -m pytest -q tests
  reproducibility: python scripts/check_reproducibility.py --config configs/pilot.yaml
  sensitivity_summary: python scripts/compare_runs.py
  colab: notebooks/stage2_colab.ipynb
configs:
  primary: configs/main.yaml
  pilot: configs/pilot.yaml
  sensitivity: [configs/sens_motion_dynamics.yaml, configs/sens_original_features.yaml, configs/sens_all_participants.yaml]
outputs_per_run:   # under results/<label>/
  - experiment_metadata.json
  - dataset_audit/
  - participant_split.json
  - baseline/            # Exp 1 score generator + gate
  - benchmark/           # manifest, score streams, coverage, leakage + sanity checks, densities
  - sweeps/              # sweep_val.csv (selection), sweep_test.csv (descriptive)
  - operating_points.csv # + operating_points.frozen.json (SHA-256 before test)
  - mechanism_metrics.csv
  - participant_metrics.csv
  - sequence_metrics.csv     # per genuine stream (session)
  - transition_metrics.csv   # per spliced sequence
  - statistical_tests.csv
  - friedman_ranks.csv
  - figures/
  - tables/
  - RESULTS_REPORT.md
  - logs/
failure_classes: [DATA, CODE, DEPENDENCY, METHODOLOGY, COMPUTATION, REPRODUCIBILITY]
